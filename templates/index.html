<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>StudyDash</title>
  <script>
    // apply saved theme + accent BEFORE first paint (avoids FOUC); no value -> follow OS via @media
    try {
      var t = localStorage.getItem("theme"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      var a = localStorage.getItem("accent"); if (a && a !== "indigo") document.documentElement.setAttribute("data-accent", a);
      if (localStorage.getItem("sidebar_collapsed")) document.documentElement.classList.add("sb-collapsed");
    } catch (e) {}
  </script>
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="{{ url_for('static', filename='vendor/inter/inter-latin-400-normal.woff2') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/katex/katex.min.css') }}">
</head>
<body>
  <div id="drop-overlay" class="drop-overlay hidden"><div>ここに教材を落とす（写真・PDF）📄</div></div>
  <input type="file" id="file-input" accept="image/*,application/pdf,.pdf,.heic,.heif" multiple hidden>

  <button id="side-toggle" class="side-toggle" type="button" aria-label="メニュー">☰</button>

  <div class="shell" id="shell">
    <!-- LEFT: navigation -->
    <aside class="sidebar" id="sidebar">
      <div class="side-brand">StudyDash</div>
      <nav class="side-nav">
        <div class="side-label">ノート</div>
        <button class="side-item" data-nav="daily" type="button">📅 <span>今日のノート</span></button>
        <button class="side-item" data-nav="docs" type="button">🗂 <span>ノート一覧</span></button>
        <button class="side-item is-soon" data-nav="search" type="button" disabled title="Phase D で有効化">🔍 <span>検索</span></button>

        <div class="side-label">学習</div>
        <button class="side-item tab active" data-tab="today" type="button">今日<span class="badge" id="badge-today"></span></button>
        <button class="side-item tab" data-tab="assignments" type="button">課題<span class="badge" id="badge-assignments"></span></button>
        <button class="side-item tab" data-tab="review" type="button">復習<span class="badge" id="badge-review"></span></button>
        <button class="side-item tab" data-tab="materials" type="button">教材<span class="badge" id="badge-materials"></span></button>
      </nav>
      <div class="side-foot">
        <div class="foot-status">
          <span id="analyzing" class="chip hidden" title="解析中の教材の数">⏳ <span id="analyzing-n">0</span></span>
          <button id="sync-info" class="chip subtle" type="button" aria-label="課題の同期" data-tip="クリックで同期・接続設定。未接続だと「手動」＝課題は手入力です"></button>
          <span id="cost-meter" class="chip subtle" data-tip="今月のAI利用のめやす（写真の解析＋カード生成の回数。表示のみで、実際に止める制限ではありません）"></span>
          <span id="backup-info" class="chip subtle warn hidden" title="バックアップ状態"></span>
        </div>
        <div class="foot-ctrls">
          <button id="accent-toggle" class="chip accent-toggle" type="button" aria-label="アクセント色" aria-haspopup="true" title="アクセント色">●</button>
          <button id="theme-toggle" class="chip theme-toggle" type="button" aria-label="テーマ切替">☾</button>
          <span class="foot-grow"></span>
          <button id="sidebar-collapse" class="chip icon-chip" type="button" aria-label="サイドバーを畳む" title="サイドバーを畳む">«</button>
        </div>
      </div>
    </aside>

    <!-- CENTER: canvas (existing tabs OR the notes outliner) -->
    <main class="canvas" id="canvas">
      <div class="crumbs" id="crumbs" hidden></div>
      <div id="main">
        <section class="panel active" id="panel-today"></section>
        <section class="panel" id="panel-assignments"></section>
        <section class="panel" id="panel-review"></section>
        <section class="panel" id="panel-materials"></section>
      </div>
      <div id="notes-view" class="notes-view hidden"></div>
    </main>

    <!-- RIGHT: contextual panel (backlinks etc. — Phase D). Hidden in B1. -->
    <aside class="rightbar" id="rightbar" hidden></aside>
  </div>

  <button id="add-fab" class="fab" title="追加 (n)">＋ 追加</button>

  <!-- inline quick-add (opens anywhere) -->
  <div id="add-form" class="add-form hidden">
    <div class="add-row">
      <input id="af-title" type="text" placeholder="課題名（例：演習問題 p.42）" autocomplete="off">
      <input id="af-course" type="text" placeholder="教科（例：数学）" autocomplete="off" list="course-list">
      <datalist id="course-list"></datalist>
    </div>
    <div class="add-row wrap">
      <div class="seg" id="af-due">
        <button data-due="today">今日</button>
        <button data-due="tomorrow" class="on">明日</button>
        <button data-due="week">今週末</button>
        <button data-due="none">なし</button>
        <input id="af-due-date" type="date">
      </div>
    </div>
    <div class="add-row wrap">
      <select id="af-category" title="種別">
        <option value="homework">宿題</option>
        <option value="quiz">小テスト</option>
        <option value="exam">試験</option>
        <option value="project">課題/レポート</option>
        <option value="other">その他</option>
      </select>
      <div class="seg" id="af-minutes">
        <button data-min="15">15分</button>
        <button data-min="60" class="on">1時間</button>
        <button data-min="180">数時間</button>
      </div>
      <input id="af-points" type="number" min="0" placeholder="配点" title="配点(任意)">
    </div>
    <div class="add-row end">
      <button id="af-cancel" class="btn ghost">キャンセル</button>
      <button id="af-save" class="btn primary">追加</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="{{ url_for('static', filename='vendor/katex/katex.min.js') }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  <script src="{{ url_for('static', filename='sd-core.js') }}"></script>
  <script src="{{ url_for('static', filename='outline.js') }}"></script>
</body>
</html>
